[build]
  command = "npm run build"
  publish = "dist/decor-site/browser"

[build.environment]
  NODE_VERSION = "24"

# Netlify serves 404.html automatically for unknown paths; this makes it explicit.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Hashed bundles are immutable; HTML must always revalidate.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
